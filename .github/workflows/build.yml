name: Build AuraAntiCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AuraAntiCheat
          path: build/libs/*.jar
