name: Build AuraAntiCheat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build plugin
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: AuraAntiCheat
          path: build/libs/*.jar
